name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idas
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: idas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idas -d idas_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://idas:ci_only_password@localhost:5432/idas_test?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - name: Generate throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: npm ci || npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations and seed
        run: npx prisma migrate deploy && npm run prisma:seed
      - name: API integration tests (real PostgreSQL)
        run: npm run test:e2e
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          sed -i "s|CHANGE_ME_use_openssl_rand_hex_24.*|ci_only|; s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 48)|" .env
          docker compose config -q
      - run: docker build -t idas-backend ./backend
      - run: docker build -t idas-frontend ./frontend

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: idas, POSTGRES_PASSWORD: ci_only_password, POSTGRES_DB: idas_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idas -d idas_e2e" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://idas:ci_only_password@localhost:5432/idas_e2e?schema=public
      PORT: "3000"
      DISABLE_JOBS: "true"
      RATE_LIMIT_PER_MINUTE: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: npm --prefix backend install --no-audit --no-fund && npm --prefix frontend install --no-audit --no-fund && npm --prefix tests install --no-audit --no-fund
      - run: cd backend && npx prisma generate && npx prisma migrate deploy && npm run prisma:seed
      - run: cd backend && npm run build && (node dist/main.js > ../backend.log 2>&1 &)
      - run: cd frontend && npm run build && (npx vite preview --port 5173 > ../frontend.log 2>&1 &)
      - run: npx --prefix tests wait-on http://localhost:3000/api/health http://localhost:5173 --timeout 90000 || (cat backend.log frontend.log; exit 1)
      - run: cd tests && npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/playwright-report }
